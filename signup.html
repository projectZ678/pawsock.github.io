<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create your account — cxt.lol</title>
  <meta name="description" content="Claim your username on cxt.lol and create your custom profile page.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">

  <div>
    <a href="/" class="auth-logo">cxt.lol</a>

    <div class="auth-card fade-up">
      <div class="auth-card-header">
        <h1>Claim your username</h1>
        <p>Pick your handle — it's yours permanently.</p>
      </div>

      <div id="signup-alert" class="alert alert-error" role="alert"></div>

      <form class="auth-form" id="signup-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <div class="username-wrapper">
            <span class="username-prefix">cxt.lol/</span>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="yourname"
              autocomplete="username"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              maxlength="24"
              required
            >
            <div class="username-status" id="username-status" aria-live="polite"></div>
          </div>
          <div class="field-hint">3–24 characters. Letters, numbers, _ and - only.</div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="At least 8 characters"
            autocomplete="new-password"
            required
          >
          <div class="password-strength" id="strength-bars" aria-hidden="true">
            <div class="strength-bar" id="bar1"></div>
            <div class="strength-bar" id="bar2"></div>
            <div class="strength-bar" id="bar3"></div>
            <div class="strength-bar" id="bar4"></div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="signup-btn">
          <span class="spinner" id="signup-spinner"></span>
          <span id="signup-btn-text">Create account</span>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login">Sign in</a>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    initSignup();
  </script>
</body>
</html>
