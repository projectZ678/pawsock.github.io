<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Profile — cxt.lol</title>
  <meta name="description" id="page-description" content="View this profile on cxt.lol">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/profile.css">
</head>
<body data-theme="glass">

  <div class="profile-bg" id="profile-bg"></div>
  <div class="profile-glow" id="profile-glow"></div>

  <div class="profile-loading" id="profile-loading">
    <div class="spinner show"></div>
  </div>

  <main class="profile-page" id="profile-page" style="display:none;">
    <div class="profile-card" id="profile-card">

      <!-- Avatar -->
      <div class="profile-avatar-wrap">
        <div id="avatar-container"></div>
      </div>

      <!-- Name -->
      <div class="profile-name" id="profile-name"></div>
      <div class="profile-username" id="profile-username-display"></div>

      <!-- Bio -->
      <div class="profile-bio" id="profile-bio" style="display:none;"></div>

      <!-- UID badge -->
      <div class="profile-uid" id="profile-uid">
        <span class="profile-uid-hash" id="uid-num"></span>
        <span id="uid-total"></span>
      </div>

      <!-- Divider -->
      <div class="profile-divider"></div>

      <!-- Social links -->
      <div class="profile-links" id="profile-links"></div>

      <!-- Views & footer -->
      <div class="profile-views" id="profile-views">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span id="views-count"></span> views
      </div>

      <div class="profile-footer">
        <span>Powered by</span>
        <a href="/" target="_blank">cxt.lol</a>
      </div>

    </div>
  </main>

  <script src="/js/profile.js"></script>
</body>
</html>
