<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — cxt.lol</title>
  <meta name="description" content="Sign in to your cxt.lol account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">

  <div>
    <a href="/" class="auth-logo">cxt.lol</a>

    <div class="auth-card fade-up">
      <div class="auth-card-header">
        <h1>Welcome back</h1>
        <p>Sign in to manage your profile.</p>
      </div>

      <div id="login-alert" class="alert alert-error" role="alert"></div>

      <form class="auth-form" id="login-form" novalidate>
        <div class="field">
          <label for="username">Username or email</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="yourname or you@example.com"
            autocomplete="username"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Your password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-btn">
          <span class="spinner" id="login-spinner"></span>
          <span id="login-btn-text">Sign in</span>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/signup">Create one</a>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    initLogin();
  </script>
</body>
</html>
